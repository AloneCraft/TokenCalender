# 配布設定。名称を変えるときは src/shared/appInfo.ts と合わせる。
appId: local.tokencalendar.app
productName: Token Calendar
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE.txt
    to: LICENSE.txt
asar: true
# 利用者に Node.js などの別途導入を求めない（Electron 同梱の Node と SQLite を使う）
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
